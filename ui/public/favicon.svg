<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8"/>
      <stop offset="100%" style="stop-color:#00D1FF"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#gradient)" opacity="0.8"/>
  <rect width="80" height="80" x="10" y="10" rx="15" fill="#000000" opacity="0.3"/>
  <circle cx="50" cy="50" r="8" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="4" fill="#00B4D8">
    <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
